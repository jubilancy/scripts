name: Auto-Index Scripts

on:
  push:
    paths:
      - 'categories/**/*.js'
      - 'categories/**/*.ts'
      - 'categories/**/*.py'
  pull_request:
    paths:
      - 'categories/**/*.js'
      - 'categories/**/*.ts'
      - 'categories/**/*.py'

jobs:
  index-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Index scripts and update JSON
        run: |
          node .github/scripts/index-scripts.js

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Script Indexer Bot"
          git add scripts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-index scripts" && git push)
