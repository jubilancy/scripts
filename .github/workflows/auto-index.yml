name: Auto-Index Scripts & Categories

on:
  push:
    paths:
      - 'categories/**'
  pull_request:
    paths:
      - 'categories/**'

jobs:
  index-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create categories.json from folder structure
        run: |
          node .github/scripts/sync-categories.js

      - name: Index scripts and update JSON
        run: |
          node .github/scripts/index-scripts.js

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Script Indexer Bot"
          git add scripts.json categories.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-index scripts and categories" && git push)
